    <style>
      :root {
        --primary-green: #1ed760;
        --primary-hover: #1fdf64;
        --bg-dark: #121212;
        --card-bg: #000000;
        --card-border: rgba(255, 255, 255, 0.08);
        --text-primary: #ffffff;
        --text-muted: #a7a7a7;
        --btn-inactive: #282828;
        --btn-inactive-text: #b3b3b3;
      }

      * {
        box-sizing: border-box;
        font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text-primary);
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        min-height: 100%;
        width: 100%;
        background-color: var(--bg-dark);
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* TOPO FIXO MODERNO E COMPACTO */
      #topoFixo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 56px;
        background-color: rgba(0, 0, 0, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 0 16px;
        padding-top: env(safe-area-inset-top, 0px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 1000;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      #logo {
        height: 26px;
        max-height: 28px;
        width: auto;
        max-width: 120px;
        object-fit: contain;
        display: block;
      }

      #saldoatual {
        padding: 6px 14px;
        border-radius: 20px;
        background: linear-gradient(135deg, #07bb34, #059b2b);
        font-size: 13px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.2px;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(7, 187, 52, 0.35);
        display: flex;
        align-items: center;
      }

      /* CARD CENTRALIZADO RESPONSIVO */
      .centralizado {
        width: 92%;
        max-width: 400px;
        margin-top: calc(56px + env(safe-area-inset-top, 0px) + 16px);
        margin-bottom: 24px;
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 22px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        animation: fadeInCard 0.35s ease-out;
      }

      @keyframes fadeInCard {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      #logocentral {
        width: 90px;
        height: auto;
        margin-bottom: 12px;
        display: block;
        object-fit: contain;
      }

      #textoprincipalsptfy {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.3;
        margin-bottom: 4px;
      }

      #descricaoiniciospotify {
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.4;
        margin-bottom: 14px;
      }

      #notificacao {
        width: 100%;
        background: rgba(30, 215, 96, 0.12);
        border: 1px solid rgba(30, 215, 96, 0.45);
        border-radius: 10px;
        padding: 8px 12px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: slideDownNotif 0.3s ease-out;
      }

      @keyframes slideDownNotif {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      #txtnotificacao {
        font-size: 13px;
        font-weight: 500;
        color: #ffffff;
      }

      #txtnotificacao b {
        color: var(--primary-green);
        font-weight: 700;
      }

      iframe {
        width: 100%;
        border-radius: 12px;
        margin-bottom: 14px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        border: none;
      }

      #avalaiacao {
        width: 100%;
      }

      .perguntacompleta {
        width: 100%;
        margin-bottom: 12px;
      }

      #texytpergunta {
        font-size: 13.5px;
        font-weight: 500;
        color: #e5e5e5;
        margin-bottom: 8px;
        text-align: center;
      }

      .botaperguntas {
        display: flex;
        gap: 10px;
        width: 100%;
      }

      .opcao {
        flex: 1;
        padding: 12px 6px;
        border-radius: 10px;
        background-color: var(--btn-inactive);
        color: var(--btn-inactive-text);
        font-weight: 600;
        font-size: 14px;
        text-align: center;
        cursor: pointer;
        border: 1.5px solid transparent;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        user-select: none;
        touch-action: manipulation;
      }

      .opcao:active {
        transform: scale(0.96);
      }

      .opcao.selecionada {
        background-color: var(--primary-green) !important;
        color: #000000 !important;
        font-weight: 700;
        border-color: var(--primary-green);
        box-shadow: 0 2px 10px rgba(30, 215, 96, 0.35);
      }

      #meuBotao {
        width: 100%;
        padding: 14px 16px;
        background-color: #242424;
        color: #777777;
        border: none;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.3px;
        margin-top: 8px;
        cursor: not-allowed;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        touch-action: manipulation;
      }

      #meuBotao.verde {
        background: linear-gradient(135deg, #1ed760, #17b34e);
        color: #000000;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(30, 215, 96, 0.45);
        animation: pulseGlow 2s infinite ease-in-out;
      }

      #meuBotao.verde:active {
        transform: scale(0.97) !important;
      }

      @keyframes pulseGlow {
        0%, 100% {
          box-shadow: 0 4px 16px rgba(30, 215, 96, 0.45);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 6px 22px rgba(30, 215, 96, 0.65);
          transform: scale(1.015);
        }
      }

      #descricaoiniciospotifyy {
        color: #737373;
        font-size: 11.5px;
        line-height: 1.5;
        margin-top: 18px;
        padding: 0 6px;
      }

      .link-verde {
        color: var(--primary-green);
        text-decoration: none;
        font-weight: 500;
      }
      .link-verde:hover {
        text-decoration: underline;
      }
    </style>

        }
        if (nome) {
            document.getElementById('mensagem').innerText = `${nome}!`;
        } else {
            document.getElementById('mensagem').innerText = 'Visitante!';
        }
    });
    </script>

    <!-- UTMIFY -->
    <script>
      if (!document.querySelector('iframe[src*="open.spotify.com"]')) {
        var s = document.createElement('script');
        s.src = 'https://cdn.utmify.com.br/scripts/utms/latest.js';
        s.async = true;
        s.defer = true;
        s.setAttribute('data-utmify-prevent-xcod-sck', '');
        s.setAttribute('data-utmify-prevent-subids', '');
        s.setAttribute('data-utmify-prevent-iframes', '');
        document.body.appendChild(s);
      }
    </script>
