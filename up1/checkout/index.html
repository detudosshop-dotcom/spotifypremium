    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 80px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 40px 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loading-icon {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(29, 185, 84, 0.2);
            border-top-color: #1DB954;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b3b3b3;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .valor-box {
            background: rgba(29, 185, 84, 0.1);
            border: 1px solid #1DB954;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .valor-total {
            font-size: 28px;
            font-weight: 700;
            color: #1DB954;
        }

        .steps {
            text-align: left;
            margin: 20px 0;
        }

        .step {
            display: flex;
            align-items: center;
            padding: 8px 0;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .step.active {
            opacity: 1;
        }

        .step.completed {
            opacity: 1;
        }

        .step-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 10px;
        }

        .step.active .step-icon {
            background: rgba(29, 185, 84, 0.2);
            color: #1DB954;
            animation: pulse 1.5s infinite;
        }

        .step.completed .step-icon {
            background: #1DB954;
            color: #000;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .step-text {
            font-size: 13px;
            color: #b3b3b3;
        }

        .step.active .step-text,
        .step.completed .step-text {
            color: #fff;
        }

        .error-message {
            background: rgba(255, 70, 70, 0.1);
            border: 1px solid #ff4646;
            border-radius: 8px;
            padding: 15px;
            color: #ff4646;
            font-size: 14px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .btn-retry {
            margin-top: 15px;
            padding: 12px 24px;
            background: #ff4646;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-retry:hover {
            background: #ff6666;
        }

                    <span class="step-text">Gerando código PIX</span>
