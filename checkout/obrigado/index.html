    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
        }

        .logo {
            width: 120px;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease;
        }

        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1DB954 0%, #1ed760 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: scaleIn 0.5s ease;
        }

        .checkmark svg {
            width: 50px;
            height: 50px;
            fill: #fff;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 15px;
            animation: fadeInUp 0.6s ease;
        }

        .subtitle {
            font-size: 16px;
            color: #b3b3b3;
            margin-bottom: 40px;
            animation: fadeInUp 0.7s ease;
        }

        .loading-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease;
        }

        .loading-steps {
            text-align: left;
        }

        .step {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .step:last-child {
            border-bottom: none;
        }

        .step.active {
            opacity: 1;
        }

        .step.completed {
            opacity: 1;
        }

        .step.completed .step-icon {
            background: #1DB954;
        }

        .step.completed .step-icon svg {
            animation: checkmark 0.3s ease;
        }

        .step-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .step-icon svg {
            width: 14px;
            height: 14px;
            fill: #fff;
        }

        .step.active .step-icon {
            background: #1DB954;
            animation: pulse 1s infinite;
        }

        .step-text {
            font-size: 14px;
            color: #fff;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1DB954 0%, #1ed760 100%);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .redirect-text {
            font-size: 13px;
            color: #b3b3b3;
            animation: fadeInUp 0.9s ease;
        }

        .redirect-text span {
            color: #1DB954;
            font-weight: 600;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes checkmark {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Spinner */
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
        </div>

        <h1>Pagamento Confirmado!</h1>
        <p class="subtitle">Seu acesso foi liberado com sucesso</p>

        <div class="loading-container">
            <div class="loading-steps">
                <div class="step" id="step1">
                    <div class="step-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                    </div>
                    <span class="step-text">Pagamento confirmado</span>
                </div>
                <div class="step" id="step2">
                    <div class="step-icon">
                        <div class="spinner"></div>
                    </div>
                    <span class="step-text">Processando seu acesso...</span>
                </div>
                <div class="step" id="step3">
                    <div class="step-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                    </div>
                    <span class="step-text">Liberando saldo acumulado</span>
                </div>
                <div class="step" id="step4">
                    <div class="step-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                        </svg>
                    </div>
                    <span class="step-text">Redirecionando...</span>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <p class="redirect-text">Você será redirecionado em <span id="countdown">5</span> segundos...</p>
    </div>

    <script>
        // Função para obter parâmetros UTM
        function getUTMs() {
            const params = new URLSearchParams(window.location.search);
            const utms = {};
            ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'sck', 'src'].forEach(param => {
                if (params.get(param)) {
                    utms[param] = params.get(param);
                }
            });
            return utms;
        }

        // Função para obter dados do cliente do localStorage
        function getDadosCliente() {
            const dadosCliente = localStorage.getItem('dados_cliente');
            if (dadosCliente) {
                return JSON.parse(dadosCliente);
            }
            return {};
              // Constrói URL de redirecionamento com UTMs e dados do cliente
        function buildRedirectUrl() {
            const params = new URLSearchParams(window.location.search);
            const dadosCliente = getDadosCliente();
            
            // Se for o pagamento do Upsell 1, redireciona para a conclusão final
            const isUp1 = params.get('tipo') === 'up1' ||
                          params.get('upsell') === '1' ||
                          params.get('valor') === '19,90' ||
                          params.get('valor') === '19.90';
            if (isUp1) {
                const baseUrl = '/checkout/conclusao.html';
                const queryString = params.toString();
                return queryString ? (baseUrl + "?" + queryString) : baseUrl;
            }

            const baseUrl = '/up1/';
            
            if (!params.get('nome') && dadosCliente.nome) params.append('nome', dadosCliente.nome);
            if (!params.get('email') && dadosCliente.email) params.append('email', dadosCliente.email);
            if (!params.get('telefone') && dadosCliente.telefone) params.append('telefone', dadosCliente.telefone);
            if (!params.get('cpf') && dadosCliente.cpf) params.append('cpf', dadosCliente.cpf);
            if (!params.get('pix') && (dadosCliente.pix || localStorage.getItem('pix_chave'))) {
                params.append('pix', dadosCliente.pix || localStorage.getItem('pix_chave'));
            }

            const queryString = params.toString();
            return queryString ? (baseUrl + "?" + queryString) : baseUrl;
        }

        // Animação dos passos
        const steps = ['step1', 'step2', 'step3', 'step4'];
        const progressFill = document.getElementById('progressFill');
        const countdownEl = document.getElementById('countdown');
        let currentStep = 0;
        let countdown = 5;

        // Marca primeiro passo como completo
        document.getElementById('step1').classList.add('completed');

        // Atualiza progresso a cada 1 segundo
        const interval = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            
            // Atualiza barra de progresso
            const progress = ((5 - countdown) / 5) * 100;
            progressFill.style.width = progress + '%';

            // Atualiza passos
            if (countdown === 4) {
                document.getElementById('step1').classList.remove('completed');
                document.getElementById('step1').classList.add('completed');
                document.getElementById('step2').classList.add('active');
            } else if (countdown === 3) {
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step2').classList.add('completed');
                document.getElementById('step3').classList.add('active');
            } else if (countdown === 2) {
                document.getElementById('step3').classList.remove('active');
                document.getElementById('step3').classList.add('completed');
                document.getElementById('step4').classList.add('active');
            } else if (countdown === 1) {
                document.getElementById('step4').classList.remove('active');
                document.getElementById('step4').classList.add('completed');
            }

            if (countdown <= 0) {
                clearInterval(interval);
                progressFill.style.width = '100%';
                window.location.href = buildRedirectUrl();
            }
        }, 1000);
    </script>
    
    <!-- UTMIFY -->
    <script
        src="https://cdn.utmify.com.br/scripts/utms/latest.js"
        data-utmify-prevent-xcod-sck
        data-utmify-prevent-subids
        async
        defer>
    </script>
